        <h1>SM HR Nexus | Premier Recruitment & HR Consulting Services</h1>
        <p>SM HR Nexus is a multi-faceted corporate management consultancy based in Chennai, India, delivering end-to-end recruitment, executive search, psychometric testing, HR SOPs, and statutory compliance services. Founded in 2011, we operate on our Conceive · Create · Complete bedrock.</p>

        <h2>Our Six Specialized Practice Areas</h2>
        <ul>
          <li><strong>End-to-End Recruitment & Executive Search</strong> — Multi-pronged sourcing strategies for entry-level to C-suite roles. Executive search handled by SM HR Nexus' exclusive team.</li>
          <li><strong>HR SOPs & Corporate Consulting</strong> — Organization-specific policies, performance management, compensation frameworks, and employee engagement structures.</li>
          <li><strong>Psychometric Testing & L&D</strong> — Advanced behavioral evaluations, OPQ assessments, cultural sensitization, and learning organization development.</li>
          <li><strong>Investigative Background Inquiries</strong> — Qualification verification, work experience checks, family background audits, and security credential auditing.</li>
          <li><strong>Statutory Compliance & Payroll</strong> — PF, ESI, PT filing, challans, monthly/annual returns, tax-friendly salary structuring.</li>
          <li><strong>Educational Consultancy Services</strong> — University brand positioning, admission lifecycle optimization, Student Skill Development Programs (SSDP).</li>
        </ul>

        <h2>Industries We Serve</h2>
        <p>Manufacturing & Heavy Engineering, IT Services & Cloud Technologies, Healthcare & Pharmaceuticals, Banking & Insurance, Private Colleges & Universities, Real Estate & Logistics.</p>

        <h2>Our Mission & Vision</h2>
        <p><strong>Mission:</strong> Bring the 3C advantage (Conceive, Create, Complete) to corporate partners, matching suitability, capability, and reliability with absolute integrity.</p>
        <p><strong>Vision:</strong> To steer corporate fortunes as India's premier multi-faceted HR advisory, recognized for executive recruitment excellence.</p>

        <h2>Core Values</h2>
        <ul>
          <li><strong>Absolute Integrity</strong> — Complete confidentiality, non-poaching ethics, and transparent evaluations.</li>
          <li><strong>Ideal Match Making</strong> — The best interest of candidate and employer partners drives our execution.</li>
          <li><strong>Execution Precision</strong> — Accurate statutory calculations and detailed investigative checks.</li>
          <li><strong>Timely Delivery</strong> — Fast talent acquisition without sacrificing quality standards.</li>
        </ul>
